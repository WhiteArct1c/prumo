apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: forbid-latest-tag
  annotations:
    policies.kyverno.io/title: Forbid the latest tag
    policies.kyverno.io/category: Prumo
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: explicit-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - prumo-dev
                - prumo-prod
      validate:
        message: "The image must have an explicit tag."
        pattern:
          spec:
            containers:
              - image: "?*:*"
    - name: no-latest
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - prumo-dev
                - prumo-prod
      validate:
        message: "The latest tag is forbidden. Publish an immutable tag."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
