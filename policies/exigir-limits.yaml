apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: exigir-limits
  annotations:
    policies.kyverno.io/title: Exigir requests e limits
    policies.kyverno.io/category: Prumo
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: containers-com-recursos
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - referencia-dev
                - referencia-prod
      validate:
        message: "Todo container precisa declarar requests e limits de cpu e memory."
        pattern:
          spec:
            containers:
              - name: "*"
                resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
