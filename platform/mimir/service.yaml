apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: prumo
spec:
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: http-metrics
      port: 9009
      targetPort: http-metrics
    - name: grpc
      port: 9095
      targetPort: grpc
