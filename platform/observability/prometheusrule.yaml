apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prumo
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: prumo
spec:
  groups:
    - name: prumo.workload
      rules:
        - alert: PrumoForaDoAr
          expr: |
            kube_deployment_status_replicas_available{namespace=~"prumo-.+", deployment="prumo"} == 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "O workload em {{ $labels.namespace }} está fora do ar."
            description: "Nenhuma réplica disponível. O caminho de entrega chegou ao cluster, mas o workload não está atendendo."
