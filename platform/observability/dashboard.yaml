apiVersion: v1
kind: ConfigMap
metadata:
  name: prumo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  prumo.json: |
    {
      "title": "Prumo",
      "uid": "prumo",
      "description": "Workload de referência em dev e prod.",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "tags": ["prumo"],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Réplicas disponíveis",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 8, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{deployment=\"prumo\"}",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Processo no ar",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 8, "x": 8, "y": 0},
          "targets": [
            {
              "expr": "sum by (namespace) (prumo_up)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Alerta PrumoForaDoAr",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 5, "w": 8, "x": 16, "y": 0},
          "targets": [
            {
              "expr": "max by (namespace) (ALERTS{alertname=\"PrumoForaDoAr\",alertstate=\"firing\"}) or kube_deployment_spec_replicas{deployment=\"prumo\"} * 0",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "mappings": [
                {"type": "value", "options": {"0": {"text": "ok", "color": "green"}, "1": {"text": "disparado", "color": "red"}}}
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Pedidos por segundo",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "targets": [
            {
              "expr": "sum by (namespace) (rate(prumo_requests_total[2m]))",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {"drawStyle": "line", "fillOpacity": 20, "spanNulls": true, "showPoints": "never"}
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Réplicas disponíveis",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{deployment=\"prumo\"}",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "custom": {"drawStyle": "line", "fillOpacity": 20, "spanNulls": true, "showPoints": "never"}
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "CPU do container app",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "targets": [
            {
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"prumo-.+\",container=\"app\"}[2m]))",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {"drawStyle": "line", "fillOpacity": 20, "spanNulls": true, "showPoints": "never"}
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Memória do container app",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "targets": [
            {
              "expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"prumo-.+\",container=\"app\"})",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {"drawStyle": "line", "fillOpacity": 20, "spanNulls": true, "showPoints": "never"}
            },
            "overrides": []
          }
        }
      ]
    }
