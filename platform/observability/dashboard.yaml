apiVersion: v1
kind: ConfigMap
metadata:
  name: prumo-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  prumo.json: |
    {
      "title": "Prumo",
      "uid": "prumo",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Workload no ar",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 0},
          "targets": [{"expr": "prumo_up", "refId": "A"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value"},
          "fieldConfig": {"defaults": {"min": 0, "max": 1}}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Réplicas disponíveis",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 0},
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{deployment=\"referencia\"}",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}}
        }
      ]
    }
