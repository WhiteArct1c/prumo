apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prumo
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: prumo
spec:
  groups:
    - name: prumo.workload
      rules:
        - alert: PrumoDown
          expr: |
            kube_deployment_status_replicas_available{namespace=~"prumo-.+", deployment="prumo"} == 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "The workload in {{ $labels.namespace }} is down."
            description: "No replica is available. The delivery path reached the cluster, but the workload is not serving."
