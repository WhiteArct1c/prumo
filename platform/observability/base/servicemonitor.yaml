apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prumo
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prumo
    app.kubernetes.io/part-of: prumo
spec:
  namespaceSelector:
    matchNames:
      - prumo-dev
      - prumo-prod
  selector:
    matchLabels:
      app.kubernetes.io/name: prumo
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
