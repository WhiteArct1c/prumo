apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform pieces and root itself. They install CRDs, webhooks, and RBAC, so the project is the size of an admin. What it limits is where the manifests come from.
  sourceRepos:
    - git://git.git.svc.cluster.local/prumo
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://kyverno.github.io/kyverno/
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
