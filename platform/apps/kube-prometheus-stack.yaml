apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.14.0
    helm:
      values: |
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          grafana.ini:
            dashboards:
              default_home_dashboard_path: /tmp/dashboards/prumo.json
            users:
              home_page: /d/prumo/prumo
          sidecar:
            datasources:
              extraJsonData:
                manageAlerts: true
                prometheusType: Prometheus
                prometheusVersion: "3.5.0"
          additionalDataSources:
            - name: Mimir
              uid: mimir
              type: prometheus
              access: proxy
              url: http://mimir.monitoring.svc:9009/prometheus
              jsonData:
                prometheusType: Mimir
                timeInterval: 30s
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc:3100
              jsonData:
                derivedFields:
                  - name: trace_id
                    matcherRegex: 'trace_id=([0-9a-f]{32})'
                    url: '$${__value.raw}'
                    datasourceUid: tempo
                    urlDisplayLabel: Abrir no Tempo
            - name: Tempo
              uid: tempo
              type: tempo
              access: proxy
              url: http://tempo.monitoring.svc:3200
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: -5m
                  spanEndTimeShift: 5m
                  customQuery: true
                  query: '{namespace=~"prumo-.+|ingress-nginx"} |= "$${__trace.traceId}"'
                tracesToMetrics:
                  datasourceUid: mimir
                serviceMap:
                  datasourceUid: mimir
                nodeGraph:
                  enabled: true
                lokiSearch:
                  datasourceUid: loki
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.prumo.test
            path: /
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: "false"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        prometheus:
          prometheusSpec:
            replicas: 1
            retention: 6h
            remoteWrite:
              - url: http://mimir.monitoring.svc:9009/api/v1/push
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 2Gi
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
        alertmanager:
          alertmanagerSpec:
            replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
