apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prumo-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: prumo
  source:
    repoURL: git://git.git.svc.cluster.local/prumo
    targetRevision: HEAD
    path: deploy/prumo/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: prumo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
