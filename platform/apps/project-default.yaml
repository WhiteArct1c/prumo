apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  # Argo CD creates default accepting everything and does not let you delete
  # it. Nothing uses this project, so it has no source, no destination, and
  # no allowed kind.
  description: Locked. Every Application declares platform or prumo.
  sourceRepos: []
  sourceNamespaces: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
