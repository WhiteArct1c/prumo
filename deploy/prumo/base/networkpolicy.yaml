apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prumo
  labels:
    app.kubernetes.io/name: prumo
    app.kubernetes.io/part-of: prumo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prumo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
    # On kind, the kubelet probes from the node network (the Docker bridge).
    # On a managed cluster this block would be the node CIDR.
    - from:
        - ipBlock:
            cidr: 172.16.0.0/12
      ports:
        - port: 8080
