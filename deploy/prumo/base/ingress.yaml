apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prumo
  labels:
    app.kubernetes.io/name: prumo
    app.kubernetes.io/part-of: prumo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: prumo.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prumo
                port:
                  name: http
  tls:
    - hosts:
        - prumo.test
      secretName: prumo-tls
