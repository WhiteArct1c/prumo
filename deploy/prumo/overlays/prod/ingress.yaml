apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prumo
spec:
  rules:
    - host: prod.prumo.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prumo
                port:
                  name: http
  tls:
    - hosts:
        - prod.prumo.test
      secretName: prumo-tls
