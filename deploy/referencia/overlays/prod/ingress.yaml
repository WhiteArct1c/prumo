apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: referencia
spec:
  rules:
    - host: referencia.prod.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: referencia
                port:
                  name: http
  tls:
    - hosts:
        - referencia.prod.localhost
      secretName: referencia-tls
