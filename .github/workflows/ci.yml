name: ci

on:
  push:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "LICENSE"
      - "keys/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "LICENSE"
      - "keys/**"

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: v5.8.3
  KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
  KUBECONFORM_VERSION: v0.6.7
  KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73

concurrency:
  group: ci-${{ github.ref }}
  # On main, cancelling mid-run can leave the image published without the tag in Git.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate manifests and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor on the workflows
        run: >-
          docker run --rm -v "${PWD}:/repo:ro" -w /repo
          ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
          --offline --no-progress .

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"

      - name: Terraform is formatted
        run: terraform fmt -check -recursive

      - name: Terraform validates
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Install kustomize and kubeconform
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSLo kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tgz" | sha256sum -c -
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar xzf kustomize.tgz kustomize
          tar xzf kubeconform.tgz kubeconform
          sudo mv kustomize kubeconform /usr/local/bin/

      - name: Kustomize and kubeconform
        run: |
          set -euo pipefail
          for overlay in dev prod; do
            kustomize build "deploy/prumo/overlays/${overlay}" \
              | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.32.0 -summary
          done
          for profile in lite full; do
            kustomize build "platform/apps/${profile}" \
              | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.32.0 -summary
            kustomize build "platform/observability/${profile}" \
              | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.32.0 -summary
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/prumo
          load: true
          push: false
          tags: prumo:ci

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: prumo:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  kind:
    name: Prove the workload on a clean kind
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: prumo
          node_image: kindest/node:v1.32.2
          # v1.12.0 defaults to kind v0.26.0, which cannot read the
          # containerd config in kindest/node:v1.32.2 ("failed to detect
          # containerd snapshotter" on kind load). v0.33.0 is the CLI on PATH.
          version: v0.33.0

      - name: Build and load the image the overlay asks for
        run: |
          IMAGE="$(kubectl kustomize deploy/prumo/overlays/dev | awk '/image: / { print $2; exit }')"
          docker build -t "${IMAGE}" apps/prumo
          kind load docker-image "${IMAGE}" --name prumo

      - name: Install cert-manager and Kyverno
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo update
          helm install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --version v1.21.3 --set crds.enabled=true --wait --timeout 10m
          helm install kyverno kyverno/kyverno \
            --namespace kyverno --create-namespace \
            --version 3.9.2 --wait --timeout 10m
          kubectl apply -k platform/certs
          kubectl apply -k policies

      - name: The policy rejects an unsafe Pod
        run: |
          kubectl create namespace prumo-dev --dry-run=client -o yaml | kubectl apply -f -
          for _ in $(seq 1 20); do
            if ! kubectl apply -f policies/fixtures/invalid-pod.yaml; then
              exit 0
            fi
            kubectl delete pod prumo-invalid -n prumo-dev --ignore-not-found
            sleep 5
          done
          echo "The invalid Pod was accepted. The policy did not hold."
          exit 1

      - name: The dev overlay becomes ready
        run: |
          kubectl apply -k deploy/prumo/overlays/dev
          kubectl -n prumo-dev rollout status deployment/prumo --timeout=180s
          kubectl -n prumo-dev port-forward svc/prumo 18080:80 >/tmp/pf.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "healthz did not answer"
          cat /tmp/pf.log
          exit 1

  release:
    name: Publish the image and update the tag
    runs-on: ubuntu-latest
    needs: [validate, kind]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag from the contents of apps/prumo
        id: tag
        run: |
          TAG="$(git rev-parse HEAD:apps/prumo)"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${TAG}" >> "$GITHUB_ENV"
          if grep -q "newTag: ${TAG}$" deploy/prumo/base/kustomization.yaml; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.tag.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.tag.outputs.publish == 'true'
        with:
          context: apps/prumo
          push: true
          tags: ${{ env.IMAGE }}

      - name: Install kustomize
        if: steps.tag.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -fsSLo kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tgz" | sha256sum -c -
          tar xzf kustomize.tgz kustomize
          sudo mv kustomize /usr/local/bin/

      - name: Write the new tag in Git
        if: steps.tag.outputs.publish == 'true'
        working-directory: deploy/prumo/base
        run: kustomize edit set image "prumo=${IMAGE}"

      # The token only appears on this step. With persist-credentials it would sit
      # in .git/config during login and the build, which run third-party actions.
      - name: Commit the tag
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/prumo/base/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(deploy): publish image ${IMAGE##*:}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "${remote}" main
          git push "${remote}" HEAD:main
